[project]
name = "claudeshift"
version = "1.0.0"
description = "Claude Code Model & Settings Switcher — cross-platform (Windows, Linux, macOS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fauzan-Fz", email = "fauzanfirdaus1966@gmail.com" }]
keywords = ["claude", "anthropic", "cli", "settings", "switcher"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "rich>=13.0",
  "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/Fauzan-Fz/ClaudeShift-CLI"
Repository = "https://github.com/Fauzan-Fz/ClaudeShift-CLI"
Issues = "https://github.com/Fauzan-Fz/ClaudeShift-CLI/issues"

[project.scripts]
claudeshift = "claudeshift.cli:main"
claude-shift = "claudeshift.cli:main"
change-cc = "claudeshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeshift"]

[tool.ruff]
line-length = 100
